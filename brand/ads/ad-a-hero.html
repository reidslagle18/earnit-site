<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=block" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<style>
  body { background: var(--em-deep); }
  .mark { position: absolute; left: 66px; top: 60px; z-index: 6; color: var(--on-em); }
  h1 {
    position: absolute; left: 66px; top: 170px; width: 880px; z-index: 6;
    font-family: var(--disp); font-weight: 600; font-size: 104px; line-height: 1.0;
    letter-spacing: -.02em; color: var(--on-em);
  }

  /* device bleeds off the bottom edge for scale */
  .phone {
    position: absolute; left: 50%; top: 452px; width: 428px; height: 878px; z-index: 5;
    transform: translateX(-50%) scale(1.24); transform-origin: 50% 0;
    border-radius: 54px; padding: 11px;
    background: linear-gradient(155deg, #46524d 0%, #131a17 40%, #2f3a35 72%, #0e1412 100%);
    box-shadow: 0 -6px 60px rgba(3,20,15,.34);
  }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: var(--paper); position: relative; }
  .notch { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 116px; height: 30px; background: #0d1210; border-radius: 16px; z-index: 3; }
  .statusbar { height: 52px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px; font-size: 17px; font-weight: 600; color: var(--ink); }
  .bars { display: flex; align-items: center; gap: 6px; }
  .bars i { display: block; width: 4px; background: var(--ink); border-radius: 1px; }
  .bars i:nth-child(1){height:6px} .bars i:nth-child(2){height:9px}
  .bars i:nth-child(3){height:12px} .bars i:nth-child(4){height:15px}
  .batt { width: 26px; height: 13px; border: 2px solid var(--ink); border-radius: 4px; position: relative; }
  .batt::after { content:""; position:absolute; inset:2px; right:9px; background:var(--ink); border-radius:1px; }

  .app-head { padding: 24px 30px 0; display: flex; align-items: baseline; justify-content: space-between; }
  .app-head h2 { font-family: var(--disp); font-weight: 600; font-size: 33px; letter-spacing: -.015em; color: var(--ink); }
  .lockpill { font-size: 15px; font-weight: 700; color: #fff; background: #9c4b40; padding: 6px 12px; border-radius: 3px; }

  .tasks { margin: 26px 22px 0; background: var(--paper-2); border-radius: 8px; box-shadow: 0 2px 10px rgba(10,60,45,.07); overflow: hidden; }
  .task { display: flex; align-items: center; gap: 15px; padding: 20px; border-bottom: 1px solid rgba(22,32,28,.07); }
  .task:last-child { border-bottom: 0; }
  .box { width: 27px; height: 27px; border-radius: 4px; flex: 0 0 auto; border: 2px solid rgba(22,32,28,.2); }
  .box.on { background: var(--em-mid); border-color: var(--em-mid); position: relative; }
  .box.on::after { content:""; position:absolute; left:7px; top:11px; width:8px; height:14px; border:3px solid #fff; border-top:0; border-left:0; transform:rotate(42deg); border-radius:1px; }
  .task .lbl { flex: 1; font-size: 20px; color: var(--ink); }
  .task.done .lbl { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .task .tag { font-size: 16px; color: var(--faint); }
  .task .tag.ok { color: var(--em-mid); font-weight: 600; }

  .unlockbar { margin: 18px 22px 0; background: var(--em-wash); border-radius: 6px; padding: 18px; text-align: center; font-size: 19px; font-weight: 600; color: var(--em-ink); }

  .lockedgrid { margin: 30px 26px 0; }
  .icons { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
  .icons div { aspect-ratio: 1; border-radius: 16px; background: #dcdcd5; position: relative; }
  .icons div::after { content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:17px; height:14px; border-radius:3px; background:#a6a69f; }
  .icons div::before { content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-100%); margin-top:-5px; width:11px; height:11px; border:3px solid #a6a69f; border-bottom:0; border-radius:7px 7px 0 0; }
</style>
</head>
<body>
  <div class="mark">Earn<span class="t">It</span></div>
  <h1>Screen time they earn.</h1>

  <div class="phone">
    <div class="screen">
      <div class="notch"></div>
      <div class="statusbar"><span>9:41</span><span class="bars"><i></i><i></i><i></i><i></i><span class="batt"></span></span></div>
      <div class="app-head"><h2>Mason&rsquo;s phone</h2><span class="lockpill">Locked</span></div>
      <div class="tasks">
        <div class="task done"><span class="box on"></span><span class="lbl">Make your bed</span><span class="tag ok">photo &#10003;</span></div>
        <div class="task done"><span class="box on"></span><span class="lbl">20 min of reading</span><span class="tag ok">timer &#10003;</span></div>
        <div class="task"><span class="box"></span><span class="lbl">Empty the dishwasher</span><span class="tag">photo</span></div>
      </div>
      <div class="unlockbar">1 task left before apps unlock</div>
      <div class="lockedgrid">
        <div class="icons"><div></div><div></div><div></div><div></div></div>
      </div>
    </div>
  </div>

  <div class="grain"></div>
</body>
</html>

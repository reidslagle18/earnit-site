<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baskervville:ital@0;1&family=Frank+Ruhl+Libre:wght@400;500&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet" />
<style>
  :root {
    --paper: #f2f1ec; --ink: #16201c; --muted: #5c655f;
    --em: #0a5240;
    --ios-blue: #248bf5;       /* real iOS iMessage bubble */
    --ios-grey: #e9e9eb;       /* incoming bubble */
    --ios-label3: #c7c7cc;
    --ios-sec: #8e8e93;        /* secondaryLabel */
    --disp: "Baskervville", Georgia, serif;
    --ui: "Frank Ruhl Libre", Georgia, serif;
    --sf: "Inter", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: var(--paper); font-family: var(--ui); position: relative; }

  .band { position: absolute; left: 0; top: 0; width: 1080px; height: 462px; z-index: 3; }
  .mark {
    position: absolute; left: 66px; top: 56px;
    font-family: var(--disp); font-weight: 600; font-size: 31px;
    letter-spacing: -.012em; font-size: 34px; color: var(--em);
  }
  .mark span { opacity: .5; }
  h1 {
    position: absolute; left: 66px; top: 166px; width: 964px;
    font-family: "Baskervville", Georgia, serif; font-weight: 400; font-size: 97px; line-height: 1.0;
    letter-spacing: -.012em; color: var(--ink);
  }
  h1 em { font-style: normal; color: var(--em); }
  .sub {
    position: absolute; left: 66px; top: 384px; width: 900px;
    font-size: 25px; color: var(--muted);
  }

  .photo {
    position: absolute; left: 0; top: 462px; width: 1080px; height: 888px; overflow: hidden; z-index: 1;
    background-image: url("plate.png");
    background-size: 1080px auto; background-position: 0 0; background-repeat: no-repeat;
  }
  .photo::after {
    content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 54px;
    background: linear-gradient(180deg, rgba(242,241,236,.85) 0%, rgba(242,241,236,0) 100%);
  }

  /* â”€â”€ the glass â”€â”€ */
  .screen {
    position: absolute; z-index: 2; overflow: hidden;
    left: 231px; top: 570px; width: 583px; height: 780px;
    border-radius: 46px 46px 0 0;
    background: #fff;
    font-family: var(--sf);
    -webkit-font-smoothing: antialiased;
  }
  .sheen {
    position: absolute; inset: 0; z-index: 9; pointer-events: none;
    background:
      linear-gradient(158deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 32%),
      linear-gradient(200deg, rgba(150,170,180,.12) 0%, rgba(150,170,180,0) 44%);
  }
  .vign {
    position: absolute; inset: 0; z-index: 10; pointer-events: none;
    border-radius: 46px 46px 0 0;
    box-shadow: inset 0 0 24px rgba(20,30,26,.18), inset 0 2px 0 rgba(255,255,255,.45);
  }

  /* status bar â€” SF-ish, with the real icon trio */
  .status {
    height: 64px; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 40px 0;
  }
  .status .time { font-size: 24px; font-weight: 600; letter-spacing: -.01em; color: #000; }
  .status .icons { display: flex; align-items: center; gap: 9px; }

  /* nav bar */
  .nav {
    position: relative; padding: 4px 0 12px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: rgba(249,249,249,.92);
    border-bottom: .5px solid rgba(60,60,67,.22);
  }
  .nav .back { position: absolute; left: 24px; top: 16px; display: flex; align-items: center; gap: 6px; }
  .nav .vid { position: absolute; right: 26px; top: 20px; }
  .nav .av {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(180deg, #b9bcc2 0%, #9a9ea6 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--sf); font-size: 26px; font-weight: 500; color: #fff;
  }
  .nav .nm {
    display: flex; align-items: center; gap: 5px;
    font-size: 19px; font-weight: 400; color: #000; letter-spacing: -.01em;
  }

  /* messages */
  .msgs { padding: 22px 22px 0; display: flex; flex-direction: column; }
  .tstamp {
    text-align: center; font-size: 17px; color: var(--ios-sec); margin: 6px 0 20px;
    letter-spacing: -.01em;
  }
  .tstamp b { font-weight: 600; color: var(--ios-sec); }
  .m {
    position: relative; align-self: flex-end; max-width: 74%;
    background: var(--ios-blue); color: #fff;
    border-radius: 30px; padding: 14px 24px;
    font-size: 25px; line-height: 1.24; letter-spacing: -.015em;
    margin-bottom: 12px;
  }
  /* the tail on the last bubble of a group â€” the detail that sells it */
  .m.last::before {
    content: ""; position: absolute; z-index: 0; bottom: 0; right: -8px;
    width: 22px; height: 24px; background: var(--ios-blue);
    border-bottom-left-radius: 18px;
  }
  .m.last::after {
    content: ""; position: absolute; z-index: 1; bottom: 0; right: -18px;
    width: 20px; height: 24px; background: #fff;
    border-bottom-left-radius: 14px;
  }
  .m span { position: relative; z-index: 2; }
  .rcpt {
    align-self: flex-end; font-size: 16px; color: var(--ios-sec);
    margin: -4px 6px 0 0; letter-spacing: -.01em;
  }
  .rcpt b { font-weight: 600; }

  /* composer */
  .composer {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
    padding: 14px 20px 34px; display: flex; align-items: center; gap: 14px;
    background: rgba(249,249,249,.94); border-top: .5px solid rgba(60,60,67,.2);
  }
  .composer .plusbtn {
    width: 44px; height: 44px; border-radius: 50%; background: #e9e9eb;
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .composer .field {
    flex: 1; height: 48px; border: 1.2px solid rgba(60,60,67,.22); border-radius: 24px;
    display: flex; align-items: center; padding: 0 18px;
    font-size: 22px; color: var(--ios-label3); letter-spacing: -.01em;
  }
  .homebar {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 11px; z-index: 5;
    width: 148px; height: 6px; border-radius: 3px; background: #000; opacity: .32;
  }
</style>
</head>
<body>
  <div class="band">
    <div class="mark">Earn<span>It</span></div>
    <h1>Screen time earned,<br /><em>not given.</em></h1>

  </div>

  <div class="photo"></div>

  <div class="screen">
    <div class="status">
      <span class="time">9:41</span>
      <span class="icons">
        <!-- cellular -->
        <svg width="28" height="20" viewBox="0 0 28 20" fill="#000">
          <rect x="0" y="12" width="4.5" height="6" rx="1.4"/>
          <rect x="7" y="9" width="4.5" height="9" rx="1.4"/>
          <rect x="14" y="5.5" width="4.5" height="12.5" rx="1.4"/>
          <rect x="21" y="2" width="4.5" height="16" rx="1.4" fill="#000" opacity=".28"/>
        </svg>
        <!-- wifi -->
        <svg width="24" height="18" viewBox="0 0 24 18" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round">
          <path d="M2 6.2a15 15 0 0 1 20 0"/>
          <path d="M6 10.2a9.4 9.4 0 0 1 12 0"/>
          <circle cx="12" cy="14.6" r="1.5" fill="#000" stroke="none"/>
        </svg>
        <!-- battery -->
        <svg width="34" height="18" viewBox="0 0 34 18">
          <rect x="0.7" y="0.7" width="28" height="16.6" rx="5" fill="none" stroke="#000" stroke-opacity=".38" stroke-width="1.4"/>
          <rect x="2.6" y="2.6" width="19" height="12.8" rx="3.4" fill="#000"/>
          <path d="M30.6 6.2v5.6a3.1 3.1 0 0 0 0-5.6z" fill="#000" fill-opacity=".4"/>
        </svg>
      </span>
    </div>

    <div class="nav">
      <span class="back">
        <svg width="15" height="26" viewBox="0 0 15 26" fill="none" stroke="#007aff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 13l9 11"/></svg>
      </span>
      <span class="vid">
        <svg width="34" height="22" viewBox="0 0 34 22" fill="#007aff"><rect x="0" y="2" width="22" height="18" rx="5"/><path d="M24 8.4 33 3.6v14.8L24 13.6z"/></svg>
      </span>
      <span class="av">M</span>
      <span class="nm">Mason
        <svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5 6 6.5l-4.5 5"/></svg>
      </span>
    </div>

    <div class="msgs">
      <div class="tstamp"><b>Today</b> 6:02 PM</div>
      <div class="m last"><span>can you take the trash out</span></div>
      <div class="tstamp">7:19 PM</div>
      <div class="m"><span>trash?</span></div>
      <div class="m last"><span>hello</span></div>
      <div class="rcpt">Delivered</div>
    </div>

    <div class="composer">
      <span class="plusbtn">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#8e8e93" stroke-width="2.4" stroke-linecap="round"><path d="M11 4v14M4 11h14"/></svg>
      </span>
      <span class="field">iMessage</span>
    </div>
    <div class="homebar"></div>

    <div class="sheen"></div>
    <div class="vign"></div>
  </div>
</body>
</html>

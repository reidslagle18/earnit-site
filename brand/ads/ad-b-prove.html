<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=block" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<style>
  body { background: var(--paper); color: var(--ink); padding: 60px 66px 72px; display: flex; flex-direction: column; justify-content: center; }
  .mark { position: absolute; left: 66px; top: 60px; color: var(--em-ink); }
  .quote {
    font-family: var(--disp); font-weight: 600; font-size: 52px;
    line-height: 1.15; letter-spacing: -.015em; color: var(--muted); max-width: 820px;
  }
  h1 {
    margin-top: 34px; font-family: var(--disp); font-weight: 700; font-size: 230px;
    line-height: .9; letter-spacing: -.035em; color: var(--em-ink);
  }

  .chip {
    margin-top: 104px; background: var(--paper-2); border-radius: 10px; padding: 30px 34px;
    display: flex; align-items: center; gap: 26px; box-shadow: 0 14px 40px rgba(10,60,45,.1);
  }
  .tick { width: 64px; height: 64px; flex: 0 0 auto; border-radius: 50%; background: var(--em-mid); position: relative; }
  .tick::after { content:""; position:absolute; left:21px; top:19px; width:16px; height:27px; border:5px solid #fff; border-top:0; border-left:0; transform:rotate(42deg); border-radius:2px; }
  .t1 { font-family: var(--disp); font-weight: 600; font-size: 34px; letter-spacing: -.012em; }
  .t2 { margin-top: 5px; font-size: 22px; color: var(--muted); }
  .stamp { margin-left: auto; text-align: right; font-size: 19px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
  <div class="mark">Earn<span class="t">It</span></div>

  <p class="quote">&ldquo;I already cleaned my room.&rdquo;</p>
  <h1>Prove it.</h1>

  <div class="chip">
    <span class="tick"></span>
    <span><div class="t1">Bed made, approved</div><div class="t2">Unlocked 1 hour of screen time</div></span>
    <span class="stamp">Photo verified<br />7:12 am</span>
  </div>

  <div class="grain"></div>
</body>
</html>
